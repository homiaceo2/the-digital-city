<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis City — 3D Explorer</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#07111e;color:#eaf8ff;font:14px system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}#viewport{position:fixed;inset:0;touch-action:none}canvas{display:block}header{position:fixed;z-index:5;top:15px;left:15px;right:15px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand,.searchbox,.panel,.controls,.hint{pointer-events:auto;background:#0b1a2be9;backdrop-filter:blur(14px);border:1px solid #52708280;box-shadow:0 12px 35px #0006;border-radius:14px}.brand{padding:13px 17px;font-size:16px;font-weight:900;letter-spacing:1px}.brand span{color:#8ff6d5}.brand small{display:block;color:#a2b8c8;font-size:10px;font-weight:500;letter-spacing:2px;margin-top:4px}.searchbox{width:min(360px,52vw);padding:8px}.searchbox input{width:100%;border:0;outline:0;background:transparent;color:white;padding:8px}.results{display:none;max-height:260px;overflow:auto}.results button{width:100%;background:transparent;color:#e5f7ff;border:0;text-align:left;padding:11px;border-radius:8px}.results button:hover{background:#29475c}.panel{position:fixed;z-index:6;right:15px;bottom:20px;width:min(340px,calc(100vw - 30px));padding:20px;display:none}.panel.show{display:block}.panel h2{margin:8px 0;font-size:22px}.panel p{color:#b0c5d3;line-height:1.6}.panel .tag{color:#8ff6d5;font-size:11px;letter-spacing:2px}.panel .price{font-size:23px;font-weight:800}.panel button{border:1px solid #5d8190;border-radius:9px;background:#193347;color:white;padding:9px 12px}.panel .close{float:right}.controls{position:fixed;z-index:5;bottom:20px;left:15px;padding:8px;display:flex;gap:7px}.controls button{border:1px solid #456778;background:#183245;color:#e7f7ff;border-radius:8px;padding:10px 13px}.hint{position:fixed;z-index:5;top:95px;left:15px;padding:10px 13px;color:#bdd0db;font-size:12px;pointer-events:none}.loading{position:fixed;inset:0;z-index:20;background:#07111e;display:grid;place-items:center;text-align:center;font-size:22px;font-weight:800;transition:opacity .6s}.loading small{font-size:12px;color:#8ff6d5;letter-spacing:3px}.loading.hide{opacity:0;pointer-events:none}.err{position:fixed;inset:0;z-index:25;background:#07111e;display:none;place-items:center;padding:25px;text-align:center}@media(max-width:700px){header{top:9px;left:9px;right:9px}.brand{font-size:12px;padding:12px}.brand small{font-size:8px}.searchbox{width:48vw}.hint{top:78px;left:9px;font-size:10px}.controls{bottom:10px;left:9px}.panel{bottom:68px;right:9px;padding:15px}.panel h2{font-size:19px}}
</style></head><body><div id="viewport"></div><div class="loading" id="loading"><div>GENESIS CITY<br><small>GENERATING YOUR WORLD…</small></div></div><div class="err" id="error">Unable to load the 3D engine. Check your internet connection and reload this page.</div><header><div class="brand">THE <span>DIGITAL</span> CITY<small>GENESIS / SATELLITE 3D</small></div><div class="searchbox"><input id="search" placeholder="⌕ Search districts or GEN-001…" autocomplete="off"><div class="results" id="results"></div></div></header><div class="hint">DRAG TO EXPLORE · PINCH / SCROLL TO ZOOM · TAP BUILDINGS</div><div class="controls"><button id="plus">＋</button><button id="minus">－</button><button id="home">⌖ Center</button><button id="rotate">⟳ Rotate</button><button id="back">↶ Portal</button></div><aside class="panel" id="panel"><button class="close" id="close">✕</button><div class="tag" id="district"></div><h2 id="title"></h2><p id="details"></p><div class="price" id="price"></div><p id="status"></p><button id="share">Share address</button></aside>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const root=document.getElementById('viewport'),scene=new THREE.Scene();scene.background=new THREE.Color('#192e42');scene.fog=new THREE.FogExp2('#192e42',.0016);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,1,7000);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc7e8ff,0x2d4d47,2.3));const sun=new THREE.DirectionalLight(0xffe7b4,2.5);sun.position.set(-600,1100,400);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-1400;sun.shadow.camera.right=1400;sun.shadow.camera.top=1400;sun.shadow.camera.bottom=-1400;scene.add(sun);
const mat=(c,roughness=1)=>new THREE.MeshStandardMaterial({color:c,roughness});const ground=mat('#345f54'),road=mat('#344750'),line=mat('#c5b995'),park=mat('#4c8967'),roof=mat('#b4bfc4'),glass=mat('#72b4ca',.3),trunk=mat('#644b36'),leaves=[mat('#39795d'),mat('#5c9871'),mat('#7c9c69')];
function box(w,h,d,m,x,y,z,shadow=false){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o}
box(2500,8,2500,ground,0,-7,0);
for(let n=-1100;n<=1100;n+=250){box(34,1,2450,road,n,0,0);box(2450,1,34,road,0,0,n);for(let p=-1080;p<=1080;p+=48){box(2,.3,18,line,n,.7,p);box(18,.3,2,line,p,.7,n)}}
const districts=[{name:'Central Square',x:0,z:0,color:'#e2ad75'},{name:'Art District',x:-650,z:-650,color:'#ae83ce'},{name:'Fashion Avenue',x:650,z:-650,color:'#d57c9d'},{name:'Innovation Quarter',x:-650,z:650,color:'#63b8cf'},{name:'Culture & Music',x:650,z:650,color:'#79c89e'}];
const lots=[],selectables=[],labels=[];
function label(text,x,y,z,scale=1){const c=document.createElement('canvas');c.width=512;c.height=100;const ctx=c.getContext('2d');ctx.fillStyle='#071e2cdd';ctx.fillRect(0,0,512,100);ctx.strokeStyle='#9ef2dc';ctx.lineWidth=4;ctx.strokeRect(2,2,508,96);ctx.font='bold 33px system-ui';ctx.textAlign='center';ctx.fillStyle='#e5fff6';ctx.fillText(text,256,64);const t=new THREE.CanvasTexture(c),sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));sp.position.set(x,y,z);sp.scale.set(225*scale,44*scale,1);scene.add(sp);labels.push(sp)}
districts.forEach((d,di)=>{label(d.name.toUpperCase(),d.x,135,d.z,1.25);const colors=[mat(d.color),mat(new THREE.Color(d.color).multiplyScalar(.72)),mat(new THREE.Color(d.color).multiplyScalar(1.2))];for(let i=0;i<70;i++){const gx=i%10,gz=Math.floor(i/10);let x=d.x+(gx-4.5)*52,z=d.z+(gz-3)*62;if(Math.abs(x)>1130||Math.abs(z)>1130)continue;if(di===0&&Math.abs(x)<135&&Math.abs(z)<135)continue;const id=di*70+i+1;const type=i%14===0?'Founder Space':i%9===0?'Billboard':i%4===0?'Storefront':'Street Poster';const occupied=i%11===0;const height=25+((i*19+di*13)%75)+(type==='Billboard'?25:0);const building=box(30,height,36,colors[i%3],x,height/2,z,true);building.userData={id,district:d.name,type,status:occupied?'Occupied':'Available',price:type==='Founder Space'?'€99 one-time':type==='Billboard'?'€49.90 / month':type==='Storefront'?'€24.90 / month':'€9.90 / month'};selectables.push(building);lots.push(building.userData);box(34,4,40,roof,x,height+2,z,true);if(i%3===0){box(25,13,2,glass,x,height*.65,z+19.3)}if(i%7===0){const ad=box(28,12,2,mat(occupied?'#e7bb75':'#8ff6d5'),x,height*.42,z+19.5);ad.userData=building.userData;selectables.push(ad)}if(i%5===0){box(7,3,7,roof,x-7,height+5,z-6)}}});
for(let i=0;i<360;i++){const x=(Math.sin(i*31.7)*1070),z=(Math.cos(i*17.1)*1070);if(Math.abs(x%250)<55||Math.abs(z%250)<55)continue;if(districts.some(d=>Math.abs(d.x-x)<275&&Math.abs(d.z-z)<260))continue;box(3,12,3,trunk,x,6,z);const tree=new THREE.Mesh(new THREE.ConeGeometry(13,29,6),leaves[i%3]);tree.position.set(x,27,z);tree.castShadow=true;scene.add(tree)}
box(180,3,180,mat('#d4b47d'),0,2,0);const tower=box(78,220,78,mat('#c2b4a0'),0,113,0,true);box(94,14,94,mat('#e4c28e'),0,231,0,true);for(let k=0;k<7;k++){box(82,4,82,glass,0,40+k*26,0)}label('GENESIS TOWER',0,275,0,1.2);
let target=new THREE.Vector3(0,0,0),radius=1600,azimuth=.68,elevation=.85;const minR=170,maxR=2500;function place(){const c=Math.cos(elevation);camera.position.set(target.x+radius*Math.sin(azimuth)*c,target.y+radius*Math.sin(elevation),target.z+radius*Math.cos(azimuth)*c);camera.lookAt(target)}
place();const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let dragging=false,moved=false,px=0,py=0,gesture=null;
function hit(clientX,clientY){pointer.x=clientX/innerWidth*2-1;pointer.y=-(clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(selectables,false)[0];if(hit)showLot(hit.object.userData)}
function showLot(l){document.getElementById('panel').classList.add('show');document.getElementById('district').textContent=l.district.toUpperCase();document.getElementById('title').textContent='GEN-'+String(l.id).padStart(3,'0');document.getElementById('details').textContent=l.type+' · A digital advertising address in '+l.district+'. This is a prototype location; real bookings are not yet available.';document.getElementById('price').textContent=l.price;document.getElementById('status').textContent=l.status+' · DEMO ONLY';history.replaceState(null,'','#lot-'+l.id);document.getElementById('share').onclick=async()=>{const url=location.href;if(navigator.share){try{await navigator.share({url,title:'Genesis City — '+l.id})}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(url);alert('Address copied')}else prompt('Copy address',url)}}
const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;dragging=true;moved=false;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!dragging||gesture)return;const dx=e.clientX-px,dy=e.clientY-py;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;const speed=radius/800;target.x-=dx*Math.cos(azimuth)*speed;target.z+=dx*Math.sin(azimuth)*speed;target.x+=dy*Math.sin(azimuth)*speed*.8;target.z+=dy*Math.cos(azimuth)*speed*.8;target.x=THREE.MathUtils.clamp(target.x,-1100,1100);target.z=THREE.MathUtils.clamp(target.z,-1100,1100);px=e.clientX;py=e.clientY;place()});canvas.addEventListener('pointerup',e=>{if(dragging&&!moved&&!gesture)hit(e.clientX,e.clientY);dragging=false});canvas.addEventListener('pointercancel',()=>dragging=false);canvas.addEventListener('wheel',e=>{e.preventDefault();radius=THREE.MathUtils.clamp(radius*Math.exp(e.deltaY*.001),minR,maxR);place()},{passive:false});
const touches=new Map();canvas.addEventListener('pointerdown',e=>{touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){const a=[...touches.values()];gesture=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);dragging=false}});canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){const a=[...touches.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(gesture){radius=THREE.MathUtils.clamp(radius*gesture/d,minR,maxR);place()}gesture=d}});const end=e=>{touches.delete(e.pointerId);if(touches.size<2)gesture=null};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
let flight=null;function go(x,z,r=700){flight={start:performance.now(),from:target.clone(),to:new THREE.Vector3(x,0,z),r0:radius,r1:r}}function updateFlight(t){if(!flight)return;const v=Math.min(1,(t-flight.start)/1150),e=v*v*(3-2*v);target.lerpVectors(flight.from,flight.to,e);radius=flight.r0+(flight.r1-flight.r0)*e;place();if(v===1)flight=null}
const search=document.getElementById('search'),results=document.getElementById('results');search.addEventListener('input',()=>{const q=search.value.toLowerCase().trim();if(!q){results.style.display='none';return}const opts=[...districts.map((d,i)=>({label:'⌖ '+d.name,action:()=>go(d.x,d.z,650)})),...lots.filter(l=>('gen-'+String(l.id).padStart(3,'0')).includes(q)||String(l.id)===q).slice(0,6).map(l=>({label:'▣ GEN-'+String(l.id).padStart(3,'0')+' · '+l.type,action:()=>{const b=selectables.find(o=>o.userData.id===l.id);if(b){go(b.position.x,b.position.z,240);showLot(l)}}}))].filter(o=>o.label.toLowerCase().includes(q)||o.label.startsWith('▣'));results.innerHTML='';opts.slice(0,12).forEach(o=>{const b=document.createElement('button');b.textContent=o.label;b.onclick=()=>{o.action();results.style.display='none';search.value=''};results.appendChild(b)});results.style.display=opts.length?'block':'none'});
document.getElementById('plus').onclick=()=>{radius=Math.max(minR,radius*.75);place()};document.getElementById('minus').onclick=()=>{radius=Math.min(maxR,radius*1.3);place()};document.getElementById('home').onclick=()=>go(0,0,1600);document.getElementById('rotate').onclick=()=>{azimuth+=Math.PI/4;place()};document.getElementById('back').onclick=()=>location.href='index.html';document.getElementById('close').onclick=()=>document.getElementById('panel').classList.remove('show');
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});const hash=location.hash.match(/^#lot-(\d+)$/);if(hash){const l=lots.find(l=>l.id===Number(hash[1]));if(l){const b=selectables.find(o=>o.userData.id===l.id);go(b.position.x,b.position.z,300);showLot(l)}}
document.getElementById('loading').classList.add('hide');renderer.setAnimationLoop(t=>{updateFlight(t);renderer.render(scene,camera)});
</script><script>window.addEventListener('error',e=>{if(e.message&&/module|import|WebGL/i.test(e.message)){document.getElementById('error').style.display='grid'}})</script></body></html>
